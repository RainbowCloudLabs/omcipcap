[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omcipcap"
dynamic = ["version"]
readme = "README.md"
description = "GPON/XGS-PON OMCI Semantic Analysis Framework for ITU-T G.988 protocols"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
]
license = {text = "MIT"}
authors = [
    {name = "Dong-Yuan Shih", email = "daneshih1125@gmail.com"}
]

[project.optional-dependencies]
rag = [
    "chromadb>=1.5,<2.0",
    "sentence-transformers>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/RainbowCloudLabs/omcipcap"
"Repository" = "https://github.com/RainbowCloudLabs/omcipcap"
"Bug Tracker" = "https://github.com/RainbowCloudLabs/omcipcap/issues"

[project.scripts]
omcipcap = "omci.cli:main"

[tool.setuptools.dynamic]
version = {attr = "omci.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["omci*"]
